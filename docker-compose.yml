name: competitor-pulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The provided data source, run unchanged from files/.
  listing-source:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./files/listing-source:/app:ro
    command: ["node", "listing-source-server.mjs"]
    ports:
      - "4002:4002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

  # The provided mock LLM, run unchanged from files/.
  mock-llm:
    image: python:3.13-alpine
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./files/mock-llm:/app:ro
    command: ["python3", "/app/mock-llm-server.py"]
    ports:
      - "4001:4001"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4001/health')"
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
